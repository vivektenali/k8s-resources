---
apiVersion: v1
kind: Pod
metadata:
  name: startup-probe
spec:
  containers:
    - name: my-app
      image: my-app:latest
      ports:
        - containerPort: 8080
      startupProbe: # Checks whether the application has started successfully
        httpGet:
          path: /health/startup # Endpoint Kubernetes calls to verify startup
          port: 8080 # Port on which the health endpoint is available
        failureThreshold: 30  # Allow up to 30 failed checks before restarting the container
        periodSeconds: 6  # Perform one startup check every 6 seconds
